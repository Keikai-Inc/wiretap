[package]
name = "hop-tap-ebpf-common"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared no_std event types for the WireTap eBPF terminal-capture programs (kernel and userspace)."
repository.workspace = true

[features]
default = []
# Enabled by hop-tap-d on the userspace side. Pulls in `aya` so we can
# `unsafe impl aya::Pod for PingEvent`. The dep below is itself
# target-gated to Linux, so enabling `user` on macOS is a no-op (the
# Pod impl is also `cfg(target_os = "linux")`).
user = []

[dependencies]
# (no deps in the default/no-std path)

# `aya` only exists for Linux userspace. The bpfel-unknown-none kernel
# target has `target_os = "none"`, so it's correctly excluded from this
# table — the kernel side never sees aya. The `impl aya::Pod` block in
# lib.rs is also `cfg(target_os = "linux")` so we don't reference an
# undeclared crate on macOS.
[target.'cfg(target_os = "linux")'.dependencies]
aya = { workspace = true }
