[package]
name = "hop-tap-d"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "hop-tap-d"
path = "src/main.rs"

[dependencies]
hop-tap-ebpf-common = { workspace = true, features = ["user"] }

# Async runtime
tokio.workspace = true

# Error handling & logging
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Linux-only: eBPF loader and per-CPU perf-array consumer.
# Target-gated so the workspace still resolves on macOS / dev machines
# where aya's syscall surface (perf_event_open, BPF()) is unavailable.
[target.'cfg(target_os = "linux")'.dependencies]
aya = { workspace = true }
aya-log = { workspace = true }
bytes = { workspace = true }
libc = { workspace = true }

[dev-dependencies]
tempfile.workspace = true
