[package]
name = "wiretap-d"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"
description = "WireTap: system-wide, tmux-style terminal session audit for Linux over eBPF. Daemon (hop-tap-d) plus the tap CLI."
repository.workspace = true

[[bin]]
name = "hop-tap-d"
path = "src/main.rs"

[[bin]]
# `tap` is the standalone CLI for the local audit utility.
# Connects directly to /run/hop-tap/local.sock; SO_PEERCRED on the
# daemon side authenticates the caller's uid (root sees all
# sessions; non-root users see only their own).
name = "tap"
path = "src/bin/tap.rs"

[[bin]]
# `tap-honeypot` is a standalone testing harness for the Phase 2
# sandbox module — drops you into bash inside the same namespace
# sandbox the daemon will eventually run a captured user's shell in.
# Not bundled with installs; for hacking on the impostor environment
# in isolation. Linux-only (the sandbox calls require unshare(2)).
name = "tap-honeypot"
path = "src/bin/tap_honeypot.rs"

[dependencies]
hop-tap-ebpf-common = { workspace = true, features = ["user"] }
hop-tap-protocol.workspace = true

# Async runtime
tokio.workspace = true

# Error handling & logging
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true

# Off-screen terminal emulation. Cross-platform — the daemon
# crate compiles on macOS too. See the project memory and the
# workspace Cargo.toml for the choice rationale.
alacritty_terminal.workspace = true

# Off-screen grid + render shared with hop's session-resume path.
# Owns a Term internally; replaces hop-tap-d's prior render_grid_for /
# emit_sgr / emit_color / FramePrelude inline code.
hop-vt.workspace = true

# Hop extension protocol — local mirror of hop-core's ExtMessage
# and Bootstrap (we deliberately don't pull hop-core to avoid its
# heavy transitive dep tree, including iroh / redb / ed25519-dalek).
ipc-channel.workspace = true
serde.workspace = true
toml.workspace = true
bincode.workspace = true
libc.workspace = true

# Used by the `tap` CLI for raw-mode stdin in `tap connect` and as
# ratatui's backend for the no-args session picker. Cross-platform
# (macOS dev builds compile too — the resulting `tap` binary is just
# unused there since the daemon is Linux-only).
crossterm = "0.29"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }

# Linux-only: eBPF loader and per-CPU perf-array consumer, plus the
# honeypot's namespace/mount/exec primitives. Target-gated so the
# workspace still resolves on macOS / dev machines where these syscalls
# don't exist.
[target.'cfg(target_os = "linux")'.dependencies]
aya = { workspace = true }
aya-log = { workspace = true }
bytes = { workspace = true }
libc = { workspace = true }
nix = { workspace = true }

[dev-dependencies]
tempfile.workspace = true
