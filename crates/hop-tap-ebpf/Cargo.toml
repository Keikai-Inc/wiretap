[package]
name = "hop-tap-ebpf"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

# This crate is built standalone (not as a workspace member) for the
# bpfel-unknown-none target with -Z build-std=core. See the workspace
# Cargo.toml comment for context.

[[bin]]
name = "hop-tap-ebpf"
path = "src/main.rs"

[dependencies]
aya-ebpf = "0.1.0"
aya-log-ebpf = "0.1.0"
hop-tap-ebpf-common = { path = "../hop-tap-ebpf-common" }

[profile.dev]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = true
panic = "abort"
incremental = false
codegen-units = 1

[profile.release]
opt-level = 3
debug = false
lto = true
panic = "abort"
codegen-units = 1
