# eBPF target configuration for hop-tap-ebpf.
#
# The actual build is driven by hop-tap-d's build.rs, which invokes
# `cargo +stage1-vlad build` here. The toolchain must be vlad's rustc
# fork that supports #[relocatable] for native CO-RE field-offset
# relocations.
#
# The linker is bpf-linker (https://github.com/aya-rs/bpf-linker),
# the LLVM-IR-level BPF linker that produces the final .bpf.o object
# with .BTF and .BTF.ext sections.

[build]
target = "bpfel-unknown-none"

[unstable]
build-std = ["core"]

[target.bpfel-unknown-none]
# Path to the bpf-linker binary. If you're working from /Users/dev/git-projects/bpf-linker
# this default works; otherwise override via the BPF_LINKER env var or
# pass --config 'target.bpfel-unknown-none.linker="..."'.
linker = "/Users/dev/git-projects/bpf-linker/target/release/bpf-linker"
rustflags = [
    "-C", "debuginfo=2",
    "-C", "link-arg=--btf",
    "-Z", "macro-backtrace",
]
