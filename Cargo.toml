[workspace]
# Note: hop-tap-ebpf is intentionally NOT a workspace member.
# It must be cross-compiled for bpfel-unknown-none with -Z build-std=core
# on a nightly toolchain (specifically: vlad's stage1 rustc fork that
# supports #[relocatable] for CO-RE relocations). Including it here would
# force those constraints onto the userspace crates too. The hop-tap-d
# build.rs invokes a separate `cargo build` for the eBPF crate.
members = [
    "crates/hop-tap-d",
    "crates/hop-tap-ebpf-common",
    "crates/hop-tap-protocol",
]
exclude = ["crates/hop-tap-ebpf"]
resolver = "2"

[workspace.package]
version = "0.2.29"
edition = "2024"
license = "LicenseRef-Proprietary"

[workspace.dependencies]
# Workspace-internal
hop-tap-ebpf-common = { path = "crates/hop-tap-ebpf-common" }
hop-tap-protocol = { path = "crates/hop-tap-protocol" }

# Async runtime
tokio = { version = "1", features = ["macros", "net", "rt", "rt-multi-thread", "sync", "time", "signal", "io-util"] }

# Error handling & logging
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Phase 1.6 (terminal emulator). Cross-platform. We use
# alacritty's headless emulator backend — pure Rust, on
# crates.io, no GUI/font/image deps. `default-features = false`
# disables the optional `serde` feature; we don't serialize
# emulator state. Explicitly NOT vt100, which had
# replay-divergence bugs in past use. (See the project memory on
# emulator choice for the full rationale.)
alacritty_terminal = { version = "0.26", default-features = false }

# Shared off-screen terminal grid + rendering primitives. Lives in
# the hop workspace because hop's session-resume path needs the same
# render that hop-tap's subscriber stream does. Pinned to a hop
# release tag; cargo checks out the whole hop repo (workspace root
# included) so hop-vt's workspace-inherited manifest resolves. Editing
# hop-vt requires a new hop tag + bumping the pin here — a local
# [paths]/[patch] override is deliberately avoided because `cross`
# mounts only the overridden subdir, not hop's workspace root, which
# breaks hop-vt's `*.workspace = true` inheritance in the container.
hop-vt = { git = "ssh://git@github.com/thedracle/hop.git", tag = "v0.6.15" }

# Serialization (used as we add features).
serde = { version = "1", features = ["derive"] }
toml = "0.8"
bincode = { version = "2", features = ["serde"] }
libc = "0.2"

# Phase 1.7 (Hop extension wiring). ipc-channel for the
# hop↔extension RPC, clap for the daemon CLI.
ipc-channel = "0.20"
clap = { version = "4", features = ["derive"] }

# Linux-only eBPF stack. These appear in workspace.dependencies so that
# every crate that uses them references the same version, but they are
# pulled into hop-tap-d/Cargo.toml only via a `cfg(target_os = "linux")`
# target table — the workspace as a whole still resolves on macOS.
aya = "0.13"
aya-log = "0.2"
bytes = "1"

# Phase 2 honeypot. Linux-only namespace + mount syscalls. Same target
# gating as the eBPF stack — the workspace still resolves on macOS.
nix = { version = "0.30", features = ["fs", "mount", "process", "sched", "user", "term", "hostname"] }

# Phase 1.7 (Hop integration). Held back because hop-core's transitive
# ed25519-dalek pre-release pulls in a buggy combination under workspace
# feature unification:
#   hop-core    = { path = "../hop/crates/hop-core" }
#   ipc-channel = "0.20"

# Testing
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
