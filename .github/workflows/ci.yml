name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Userspace gate. The eBPF object is embedded via include_bytes! only on
  # Linux, so the macOS build compiles the daemon, CLI and protocol crates
  # without needing the object or the pinned toolchain. This is the lane that
  # a fork PR runs, so it needs no secrets and no prebuilt artifact.
  userspace-macos:
    runs-on: macos-latest
    env:
      HOP_TAP_SKIP_EBPF_BUILD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test
      - name: release build
        run: cargo build --release -p hop-tap-d

  # Userspace on Linux, using the prebuilt eBPF object published with releases
  # (release.sh uploads it + a sha256). This lane compiles the code path that
  # actually loads the object. It is skipped automatically until the object URL
  # is reachable, so CI stays green before the CDN move (F6) lands; set the repo
  # variable HOP_TAP_EBPF_URL to enable it.
  userspace-linux:
    runs-on: ubuntu-latest
    if: vars.HOP_TAP_EBPF_URL != ''
    env:
      HOP_TAP_SKIP_EBPF_BUILD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: fetch prebuilt eBPF object
        run: |
          dest=crates/hop-tap-ebpf/target/bpfel-unknown-none/release
          mkdir -p "$dest"
          curl -fsSL "${{ vars.HOP_TAP_EBPF_URL }}" -o "$dest/hop-tap-ebpf"
          curl -fsSL "${{ vars.HOP_TAP_EBPF_URL }}.sha256" -o "$dest/hop-tap-ebpf.sha256" || true
          if [ -f "$dest/hop-tap-ebpf.sha256" ]; then
            (cd "$dest" && sha256sum -c hop-tap-ebpf.sha256)
          fi
      - name: clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test

  # Kernel-side build. Needs the pinned rustc fork + bpf-linker
  # (docs/ebpf-toolchain.md). Building rustc takes 30-90 min, so this runs
  # against a cached toolchain image; it is enabled once that image exists
  # (set the repo variable HOP_TAP_TOOLCHAIN_IMAGE).
  ebpf-build:
    runs-on: ubuntu-latest
    if: vars.HOP_TAP_TOOLCHAIN_IMAGE != ''
    container: ${{ vars.HOP_TAP_TOOLCHAIN_IMAGE }}
    steps:
      - uses: actions/checkout@v4
      - name: build the eBPF program
        working-directory: crates/hop-tap-ebpf
        run: cargo +stage1-vlad build --release --target bpfel-unknown-none

  shell-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n over tracked shell scripts
        run: |
          fail=0
          while IFS= read -r f; do
            bash -n "$f" || fail=1
          done < <(git ls-files '*.sh')
          exit $fail
      - name: shellcheck installers and release tooling
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S error install.sh scripts/*.sh || true
